[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend for Margin"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.163.1",
    "httpx>=0.28.1",
    "nvidia-riva-client>=2.28.0",
    "pgvector>=0.5.1",
    "python-dotenv>=1.2.4",
    "psycopg[binary]>=3.3.9",
    "sqlalchemy>=2.1.8",
    "trafilatura>=2.3.1",
    "scrapling[fetchers]>=0.5.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.13"
